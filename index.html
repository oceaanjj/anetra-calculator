<!DOCTYPE html>
<html>
<head> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANETRA CALCULATOR !</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./img/anetra.png" type="IMAGE">
</head>

<header>
    <div align="center"> 
        <img src="./img/logo.png" width="15%"/>
    </div>
   
</header>

<body>
    <div align="center" id="calculator">
    

        <div id="shadow">
            <form name="numbers">
                <div id="calcuscreen">

                    <div id="doublecolor">
                        <div class="battery">
                            <div class="batt">
                                <img src="./img/logoo.png" id="logocalcu">
                            </div>

                           
                        </div> 

                        <input type="text" id="screen" placeholder="0" readonly>
                    </div>
                </div>

                <div id="calcunum">
                    <div>
                        <input type="button" value = "AC" onclick = "allClear()" class="number">
                        <input type="button" value = "DEL" onclick="del()" class="number">
                        <input type="button" value = "%" onclick = "specialSign()" class="signs">
                        <input type="button" value = "-" onclick = "calcuSign('-')" class="signs">
                        
                    </div>

                    <div>
                        <input type="button" value = "7" onclick = "keypad('7')" class="number">
                        <input type="button" value = "8" onclick = "keypad('8')" class="number">
                        <input type="button" value = "9" onclick = "keypad('9')" class="number">
                        <input type="button" value = "&times;" onclick = "calcuSign('\u00D7')" class="signs">
                    </div>

                    <div>
                        <input type="button" value = "4" onclick = "keypad('4')" class="number">
                        <input type="button" value = "5" onclick = "keypad('5')" class="number">
                        <input type="button" value = "6" onclick = "keypad('6')" class="number">
                        <input type="button" value = "&divide;" onclick = "calcuSign('\u00F7')" class="signs">
                    </div>

                    <div>
                        <input type="button" value = "1" onclick = "keypad('1')" class="number">
                        <input type="button" value = "2" onclick = "keypad('2')" class="number">
                        <input type="button" value = "3" onclick = "keypad('3')" class="number">
                        <input type="button" value = "+" onclick = "calcuSign('+')" class="signs">

                    </div>

                    <div>
                        <input type="button" value = "0" onclick = "keypad('0')" class="number">
                        <input type="button" value = "&times; 10" onclick = "calcuSign('\u00D710')" class="number">
                        <input type="button" value = "=" onclick = "calculate()" class="equal">
                    </div>
                </div>
            </form>
            </div>
        </div>
    
    <footer>
        <div class="footer-card">
            <span class="footer-label">Developed By</span>
            <p id="submitted">JOVILYN ESQUERRA <span class="footer-separator">&bull;</span> BSCS 1A <span class="footer-separator">&bull;</span> 2024</p>
        </div>
    </footer>

    <script src="./js/script.js"></script>
</body>

</html>
